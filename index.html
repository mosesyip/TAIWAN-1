<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全台股量化小白儀表板</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/30 min-h-screen p-4 md:p-8 font-sans text-slate-700">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- 頂部標頭說明 -->
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-amber-100/80">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
        <div>
          <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
            🌱 全台股小白量化卡片
          </h1>
          <p class="text-xs text-slate-500 mt-1">從全台 2000+ 檔股票中，自動嚴選出兼具「高利息 + 甜甜價 + 容易買賣」的優質好股</p>
        </div>
        <span class="px-4 py-1.5 rounded-full bg-emerald-50 text-emerald-600 text-xs font-bold border border-emerald-100 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 全市場每日自動掃描中
        </span>
      </div>

      <!-- 4大白話文條件卡 -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-2 pt-3 border-t border-slate-100 text-xs">
        <div class="bg-amber-50/50 p-2.5 rounded-2xl border border-amber-100/50">
          <div class="font-bold text-amber-800">1. 熱門易買賣</div>
          <div class="text-slate-400 text-[11px]">20日均成交 > 3,000萬</div>
        </div>
        <div class="bg-emerald-50/50 p-2.5 rounded-2xl border border-emerald-100/50">
          <div class="font-bold text-emerald-800">2. 價格不買貴</div>
          <div class="text-slate-400 text-[11px]">本益比 < 18 倍</div>
        </div>
        <div class="bg-blue-50/50 p-2.5 rounded-2xl border border-blue-100/50">
          <div class="font-bold text-blue-800">3. 高年領利息</div>
          <div class="text-slate-400 text-[11px]">現金殖利率 ≥ 4.5%</div>
        </div>
        <div class="bg-purple-50/50 p-2.5 rounded-2xl border border-purple-100/50">
          <div class="font-bold text-purple-800">4. 潛力中小型</div>
          <div class="text-slate-400 text-[11px]">總市值 < 2,000 億元</div>
        </div>
      </div>
    </div>

    <!-- 股票卡片容器 -->
    <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="col-span-full text-center py-12 text-slate-400">正在連線讀取最新的全台股掃描報告...</div>
    </div>

  </div>

  <script>
    fetch('./stocks.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('cards-container');
        if (!data || data.length === 0) {
          container.innerHTML = `
            <div class="col-span-full bg-white rounded-3xl p-12 text-center text-slate-400 border border-slate-100">
              <p class="text-lg font-bold text-slate-600 mb-2">今天全市場沒有符合 4 大嚴格條件的股票</p>
              <p class="text-xs">這代表目前大盤價格偏高，系統自動幫你擋掉不夠便宜的標的囉！</p>
            </div>`;
          return;
        }

        container.innerHTML = data.map(item => `
          <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 hover:shadow-md transition-all flex flex-col justify-between space-y-4">
            <!-- 股票頭部資訊 -->
            <div>
              <div class="flex justify-between items-start mb-2">
                <div>
                  <div class="flex items-center gap-2 mb-1">
                    <span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 font-mono text-xs font-bold">${item.code}</span>
                    <span class="text-xs text-slate-400 font-medium">${item.market}</span>
                  </div>
                  <h3 class="text-xl font-bold text-slate-800">${item.name}</h3>
                </div>
                <div class="text-right">
                  <div class="text-xs text-slate-400">目前一股價格</div>
                  <div class="text-xl font-extrabold text-rose-500">${item.price}</div>
                </div>
              </div>

              <!-- 可愛白話標籤 -->
              <div class="flex flex-wrap gap-1.5 my-3">
                ${item.tags.map(t => `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-amber-50 text-amber-700 border border-amber-100/80">${t}</span>`).join('')}
              </div>
            </div>

            <!-- 白話數據解釋區 -->
            <div class="pt-3 border-t border-slate-100 grid grid-cols-3 gap-2 text-center bg-slate-50/60 p-3 rounded-2xl">
              <div>
                <div class="text-[11px] text-slate-400 mb-0.5">💰 預估年利息</div>
                <div class="text-base font-extrabold text-emerald-600">${item.yield}</div>
                <div class="text-[9px] text-slate-400">殖利率</div>
              </div>
              <div>
                <div class="text-[11px] text-slate-400 mb-0.5">🏷️ 價格划算度</div>
                <div class="text-base font-extrabold text-blue-600">${item.pe}</div>
                <div class="text-[9px] text-slate-400">本益比</div>
              </div>
              <div>
                <div class="text-[11px] text-slate-400 mb-0.5">🔥 每日交易熱度</div>
                <div class="text-base font-extrabold text-purple-600">${item.turnover}</div>
                <div class="text-[9px] text-slate-400">20日均額</div>
              </div>
            </div>
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('cards-container').innerHTML = '<div class="col-span-full text-center py-12 text-slate-400">系統正在背景更新中，請手動觸發一次 Actions 喔！</div>';
      });
  </script>
</body>
</html>
