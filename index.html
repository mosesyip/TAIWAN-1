<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全台股小白量化卡片 - AI 嚴選 TOP 20</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/30 min-h-screen p-4 md:p-8 font-sans text-slate-700">
  <div class="max-w-6xl mx-auto space-y-8">
    
    <!-- 頂部說明 -->
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-amber-100/80">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
        <div>
          <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">🌱 全台股 AI 量化嚴選 TOP 20</h1>
          <p class="text-xs text-slate-500 mt-1">掃描全台 2000+ 股票，結合 4 大基本面門檻與 AI 綜合 CP 值深度排序</p>
        </div>
        <span class="px-4 py-1.5 rounded-full bg-emerald-50 text-emerald-600 text-xs font-bold border border-emerald-100">
          ● 每日自動掃描中
        </span>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-2 pt-3 border-t border-slate-100 text-xs">
        <div class="bg-amber-50/50 p-2.5 rounded-2xl"><b>1. 熱門易買賣</b><div class="text-slate-400 text-[10px]">20日均額 > 3,000萬</div></div>
        <div class="bg-emerald-50/50 p-2.5 rounded-2xl"><b>2. 價格不買貴</b><div class="text-slate-400 text-[10px]">本益比 < 18 倍</div></div>
        <div class="bg-blue-50/50 p-2.5 rounded-2xl"><b>3. 高年領利息</b><div class="text-slate-400 text-[10px]">現金殖利率 ≥ 4.5%</div></div>
        <div class="bg-purple-50/50 p-2.5 rounded-2xl"><b>4. 潛力中小型</b><div class="text-slate-400 text-[10px]">總市值 < 2,000 億元</div></div>
      </div>
    </div>

    <!-- 前 20 名列表 -->
    <section>
      <div class="mb-4 flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          🏆 今日精選 Top 20 榜單
        </h2>
        <span class="text-xs text-slate-400">依 AI 綜合 CP 值與符合條件數排序</span>
      </div>
      <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

  </div>

  <script>
    function createCard(item) {
      const isTop3 = item.rank <= 3;
      const rankBadgeColor = item.rank === 1 ? 'bg-amber-400 text-white' : item.rank === 2 ? 'bg-slate-300 text-slate-800' : item.rank === 3 ? 'bg-amber-600 text-white' : 'bg-slate-100 text-slate-600';

      return `
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 flex flex-col justify-between space-y-3 relative overflow-hidden">
          <div>
            <div class="flex justify-between items-start">
              <div class="flex items-center gap-2">
                <span class="w-7 h-7 rounded-full ${rankBadgeColor} flex items-center justify-center text-xs font-black shadow-sm">
                  ${item.rank}
                </span>
                <div>
                  <span class="text-xs text-slate-400 font-mono">${item.code} · ${item.market}</span>
                  <h3 class="text-xl font-bold text-slate-800">${item.name}</h3>
                </div>
              </div>
              <div class="text-right">
                <div class="text-[10px] text-slate-400">目前股價</div>
                <div class="text-lg font-extrabold text-rose-500">${item.price}</div>
              </div>
            </div>

            <!-- AI 評分列 -->
            <div class="mt-3 mb-2 p-2 rounded-2xl bg-slate-50 border border-slate-100 flex justify-between items-center text-xs">
              <span class="text-slate-500 font-medium">${item.ai_comment}</span>
              <span class="font-black text-amber-600 bg-amber-50 px-2 py-0.5 rounded-lg border border-amber-100">CP值 ${item.score}分</span>
            </div>

            <div class="flex flex-wrap gap-1.5 my-2">
              ${item.tags.map(t => `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-50 text-amber-700 border border-amber-100">${t}</span>`).join('')}
            </div>
          </div>

          <div class="pt-2 border-t border-slate-100 grid grid-cols-3 gap-1 text-center bg-slate-50/60 p-2.5 rounded-2xl text-xs">
            <div><div class="text-slate-400 text-[10px]">預估年利息</div><div class="font-extrabold text-emerald-600">${item.yield}</div></div>
            <div><div class="text-slate-400 text-[10px]">價格劃算度</div><div class="font-extrabold text-blue-600">${item.pe}</div></div>
            <div><div class="text-slate-400 text-[10px]">每日交易熱度</div><div class="font-extrabold text-purple-600">${item.turnover}</div></div>
          </div>
        </div>
      `;
    }

    fetch('./stocks.json')
      .then(res => res.json())
      .then(data => {
        const list = data.top_20 || [];
        const container = document.getElementById('cards-container');

        if (list.length === 0) {
          container.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400">目前市場無符合條件的標的</div>`;
        } else {
          container.innerHTML = list.map(item => createCard(item)).join('');
        }
      });
  </script>
</body>
</html>
