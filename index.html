<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全台股量化選股監控台</title>
  <style>
    :root { --ink:#25312d; --muted:#6d7973; --line:#e5e8e3; --paper:#f6f4ee; --card:#fff; --green:#267454; --teal:#287b7a; --amber:#b07d22; }
    * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif; }
    .wrap { max-width:1500px; margin:auto; padding:28px 32px 48px; } header { display:flex; justify-content:space-between; gap:28px; margin-bottom:20px; } h1 { margin:0; font-size:28px; } .subtitle,.meta { color:var(--muted); } .meta { text-align:right; font-size:13px; } .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:20px 0; }.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:15px 18px; }.card strong { display:block; font-size:23px; margin-top:3px; }
    .tools { display:flex; gap:12px; align-items:center; margin:22px 0 14px; }.tabs { display:flex; gap:8px; } button,select,input { border:1px solid var(--line); background:#fff; border-radius:7px; padding:9px 11px; font:inherit; color:var(--ink); } button { cursor:pointer; } button.active { background:var(--green); border-color:var(--green); color:#fff; } input { width:260px; margin-left:auto; }
    .table-wrap { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:auto; } table { width:100%; border-collapse:collapse; min-width:1250px; } th { color:var(--muted); font-size:12px; font-weight:600; background:#fbfcfa; white-space:nowrap; } th,td { border-bottom:1px solid var(--line); padding:12px 10px; text-align:left; } tbody tr:hover { background:#fbfdfb; } .num { text-align:right; font-variant-numeric:tabular-nums; } a { color:var(--green); text-decoration:none; font-weight:650; }.score { border-radius:999px; display:inline-block; min-width:43px; text-align:center; padding:3px 8px; font-weight:700; }.s90{background:#e1f0e7;color:#216342}.s80{background:#e3f1ef;color:#176a68}.s70{background:#f8efd6;color:#8a6319}.s0{background:#edf0ed;color:#69736d}.error { background:#fff1f0; color:#9d3630; border:1px solid #f0cbc8; padding:18px; border-radius:10px; }.note { color:var(--muted); margin:12px 0 0; font-size:12px; }
    @media (max-width:850px) { .wrap{padding:18px}.cards{grid-template-columns:repeat(2,1fr)} header{display:block}.meta{text-align:left;margin-top:12px}.tools{flex-wrap:wrap}input{margin-left:0;width:auto} }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div><h1>🛡️ 全台股量化選股監控台</h1><div class="subtitle">基本面 × 估值 × 股息 × 流動性 × 成長潛力</div></div>
      <div class="meta" id="meta">資料更新時間：載入中…<br>資料日期：—<br><a href="https://openapi.twse.com.tw/" target="_blank" rel="noopener">資料來源：TWSE / TPEx OpenAPI</a></div>
    </header>
    <section class="cards"><div class="card">通過篩選<strong id="passed">—</strong></div><div class="card">精選<strong id="elite">20 檔</strong></div><div class="card">資料日期<strong id="date">—</strong></div><div class="card">模型版本<strong>Quant V2</strong></div></section>
    <section class="tools"><div class="tabs"><button class="active" data-list="stocks_overall">⭐ 綜合 CP</button><button data-list="stocks_defense">🛡️ 防禦價值</button><button data-list="stocks_momentum">🚀 成長 / 動能</button></div><input id="search" aria-label="搜尋" placeholder="搜尋代碼 / 公司 / 產業 / 評語"><select id="sort" aria-label="排序"><option value="active_score">綜合分數</option><option value="value_score">Value</option><option value="growth_score">Growth</option><option value="quality_score">Quality</option><option value="yield_rate">殖利率</option><option value="pe">PE</option><option value="turnover_10k">成交金額</option></select></section>
    <div id="content" class="table-wrap"></div><p class="note">本網站僅提供資料整理與自訂量化模型分析，不構成投資建議；分數不代表未來報酬。</p>
  </main>
<script>
(() => {
  const content = document.querySelector('#content'), search = document.querySelector('#search'), sort = document.querySelector('#sort');
  let payload, activeList = 'stocks_overall';
  const fmt = (v, suffix='') => v === null || v === undefined ? '—' : `${Number(v).toLocaleString('zh-TW', {maximumFractionDigits:2})}${suffix}`;
  const score = v => `<span class="score s${v >= 90 ? 90 : v >= 80 ? 80 : v >= 70 ? 70 : 0}">${fmt(v)}</span>`;
  const render = () => {
    const query = search.value.trim().toLowerCase(); const key = sort.value;
    let list = [...(payload[activeList] || [])].filter(s => [s.code,s.name,s.category,s.highlight].join(' ').toLowerCase().includes(query));
    list.sort((a,b) => { const av=a[key], bv=b[key]; if (av == null && bv == null) return 0; if (av == null) return 1; if (bv == null) return -1; return key === 'pe' ? av-bv : bv-av; });
    content.innerHTML = `<table><thead><tr><th>#<br>排名</th><th>代碼</th><th>公司</th><th>產業</th><th class="num">CP</th><th class="num">Value</th><th class="num">Growth</th><th class="num">Quality</th><th class="num">股價</th><th class="num">PE</th><th class="num">殖利率</th><th class="num">成交額</th><th>模型評語</th></tr></thead><tbody>${list.map((s,i)=>`<tr><td>${i+1}</td><td><a href="${s.link}" target="_blank" rel="noopener">${s.code}</a></td><td>${s.name}</td><td>${s.category || '—'}</td><td class="num">${score(s.overall_score)}</td><td class="num">${fmt(s.value_score)}</td><td class="num">${fmt(s.growth_score)}</td><td class="num">${fmt(s.quality_score)}</td><td class="num">${fmt(s.price)}</td><td class="num">${fmt(s.pe)}</td><td class="num">${fmt(s.yield_rate,'%')}</td><td class="num">${s.turnover_formatted || '—'}</td><td>${s.highlight || '—'}</td></tr>`).join('') || '<tr><td colspan="13">沒有符合搜尋條件的股票。</td></tr>'}</tbody></table>`;
  };
  fetch('./data.json?v=' + Date.now()).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }).then(data => {
    payload=data; if (data.status) throw new Error(data.status); document.querySelector('#passed').textContent=`${data.all_passed_count ?? '—'} 檔`; document.querySelector('#elite').textContent=`${(data.elite_20 || []).length} 檔`; document.querySelector('#date').textContent=data.market_date || '—'; document.querySelector('#meta').innerHTML=`資料更新時間：${data.update_time || '—'}<br>資料日期：${data.market_date || '—'}<br><a href="https://openapi.twse.com.tw/" target="_blank" rel="noopener">資料來源：TWSE / TPEx OpenAPI</a>`; render();
  }).catch(error => { console.error('data.json load error:', error); content.className='error'; content.innerHTML='資料載入失敗<br><small>請確認 data.json 是否存在，或 GitHub Actions 是否成功更新。</small>'; });
  document.querySelectorAll('[data-list]').forEach(button => button.addEventListener('click', () => { document.querySelector('.active').classList.remove('active'); button.classList.add('active'); activeList=button.dataset.list; sort.value='active_score'; render(); })); search.addEventListener('input',render); sort.addEventListener('change',render);
})();
</script>
</body></html>
