name: Auto Update Stock Data

on:
  schedule:
    - cron: '0 6 * * *'  # 台灣時間每日 14:00 自動執行
  workflow_dispatch:      # 支援手動點擊測試

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查專案程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝必要套件
        run: pip install pandas yfinance html5lib lxml

      - name: 執行選股與數據更新
        run: python main.py

      - name: 推送最新數據回 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks.json
          git commit -m "Auto update stock data" || exit 0
          git push
