name: Auto Update Stock Data

on:
  schedule:
    - cron: '0 6 * * *'  # 每日台灣時間 14:00 自動執行
  workflow_dispatch:

permissions:
  contents: write  # 賦予寫入權限，讓 Actions 可以 Push 檔案

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: Run crawler script
        run: python main.py

      - name: Commit and Push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json stocks.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update stock json data" && git push)
